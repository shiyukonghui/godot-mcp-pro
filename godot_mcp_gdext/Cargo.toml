[package]
name = "godot_mcp_gdext"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Godot 4 GDExtension Rust 绑定库
godot = "0.5"
# JSON 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 异步运行时 (TCP 服务器用)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "time"] }
# 跨线程通道
crossbeam = "0.8"
# Base64 编码 (资源预览用)
base64 = "0.22"
